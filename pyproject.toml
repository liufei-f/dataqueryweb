[project]
name = "dataqueryweb"
version = "0.1"
description = "Find where the QTL data behind a publication can be downloaded."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.scripts]
dataqueryweb = "dataqueryweb.web:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend/dataqueryweb"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src/backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Long regexes and URL templates read better unwrapped.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/backend"]
